name: WAX claim

on:
  workflow_dispatch:   # triggered by cron-job.org via the GitHub API

permissions:
  contents: write      # needed to commit state.json

concurrency:
  group: wax-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Claim if due
        env:
          WAX_PRIVATE_KEY: ${{ secrets.WAX_PRIVATE_KEY }}
        run: node claim.js

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "wax-claim-bot"
            git config user.email "wax-claim-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update claim state"
            git push
          fi
