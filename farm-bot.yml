name: Farm Bot

on:
  schedule:
    # every 30 minutes — adjust to taste
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @wharfkit/session @wharfkit/antelope @wharfkit/wallet-plugin-privatekey

      - name: Run bot
        env:
          WAX_ACCOUNT: ${{ vars.WAX_ACCOUNT }}
          WAX_BOT_KEY: ${{ secrets.WAX_BOT_KEY }}
        run: node bot-runner.mjs
